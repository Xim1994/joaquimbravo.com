<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>404 — Joaquim Bravo</title>
<meta name="robots" content="noindex" />
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: 'Inter', -apple-system, sans-serif;
    background: #fcfcfa;
    color: #111;
    display: grid;
    place-items: center;
    text-align: center;
    padding: 40px;
    background:
      radial-gradient(600px circle at 0% 0%, rgba(179,0,0,0.08), transparent 50%),
      radial-gradient(800px circle at 100% 100%, rgba(179,0,0,0.06), transparent 50%),
      #fcfcfa;
  }
  @media (prefers-color-scheme: dark) {
    body { background: #0d0d0e; color: #f4f4f2; }
    .brand small { color: #a8a8a2; }
    .code { color: #6e6e68; }
  }
  .monogram {
    width: 72px; height: 72px; border-radius: 16px;
    background: linear-gradient(135deg, #B30000 0%, #d94c3d 100%);
    color: #fff;
    display: grid; place-items: center;
    font-family: 'Fraunces', Georgia, serif;
    font-weight: 700; font-size: 32px; letter-spacing: -0.02em;
    margin: 0 auto 24px;
    transform: rotate(-3deg);
    box-shadow: 0 8px 24px rgba(179,0,0,0.25);
  }
  .code {
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    color: #888;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-bottom: 14px;
  }
  h1 {
    font-family: 'Fraunces', Georgia, serif;
    font-weight: 600;
    font-size: 56px;
    letter-spacing: -0.03em;
    line-height: 1;
    margin-bottom: 16px;
  }
  h1 em { font-style: italic; color: #B30000; }
  p { font-size: 16px; color: #555; margin-bottom: 28px; max-width: 440px; }
  a.home {
    display: inline-block;
    padding: 10px 22px;
    background: #B30000;
    color: #fff;
    border-radius: 8px;
    text-decoration: none;
    font-weight: 600;
    font-size: 14px;
    transition: transform 0.15s, background 0.15s;
  }
  a.home:hover { background: #8a0000; transform: translateY(-1px); }
</style>
</head>
<body>
  <div>
    <div class="monogram">JB</div>
    <div class="code">Error 404</div>
    <h1>Page not <em>found</em>.</h1>
    <p>Looks like that page doesn't exist. No drama — head back to the home page.</p>
    <a class="home" href="/">← Back home</a>
  </div>
</body>
</html>

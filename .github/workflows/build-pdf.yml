name: Build CV PDFs

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - '.github/workflows/build-pdf.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install puppeteer
        run: npm install puppeteer

      - name: Start static server
        run: |
          npx --yes http-server . -p 8080 &
          sleep 3

      - name: Generate English PDF
        run: |
          node <<'EOF'
          const puppeteer = require('puppeteer');
          (async () => {
            const browser = await puppeteer.launch({ args: ['--no-sandbox'] });
            const page = await browser.newPage();
            await page.goto('http://localhost:8080/?pdf=en', { waitUntil: 'networkidle0' });
            await page.evaluate(() => setLang('en'));
            await page.waitForTimeout(500);
            await page.emulateMediaType('print');
            await page.pdf({
              path: 'cv-en.pdf',
              format: 'A4',
              printBackground: true,
              margin: { top: '10mm', right: '10mm', bottom: '10mm', left: '10mm' },
            });
            await browser.close();
          })();
          EOF

      - name: Generate Spanish PDF
        run: |
          node <<'EOF'
          const puppeteer = require('puppeteer');
          (async () => {
            const browser = await puppeteer.launch({ args: ['--no-sandbox'] });
            const page = await browser.newPage();
            await page.goto('http://localhost:8080/?pdf=es', { waitUntil: 'networkidle0' });
            await page.evaluate(() => setLang('es'));
            await page.waitForTimeout(500);
            await page.emulateMediaType('print');
            await page.pdf({
              path: 'cv-es.pdf',
              format: 'A4',
              printBackground: true,
              margin: { top: '10mm', right: '10mm', bottom: '10mm', left: '10mm' },
            });
            await browser.close();
          })();
          EOF

      - name: Commit PDFs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add cv-en.pdf cv-es.pdf
          git diff --staged --quiet || git commit -m "chore: rebuild CV PDFs [skip ci]"
          git push
